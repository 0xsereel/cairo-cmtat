name: Cairo CMTAT CI

on:
  push:
    branches: [ main ]
  pull_request:

# Toolchain versions come from .tool-versions.
jobs:
  check:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Scarb
      uses: software-mansion/setup-scarb@v1

    - name: Setup Starknet Foundry
      uses: foundry-rs/setup-snfoundry@v4

    - name: Install cairo-coverage
      run: curl -sL https://raw.githubusercontent.com/software-mansion/cairo-coverage/main/scripts/install.sh | sh

    - name: Format check
      run: scarb fmt --check

    - name: Build (fail on warnings)
      run: |
        set -o pipefail
        scarb build 2>&1 | tee build.log
        if grep -q '^warn' build.log; then
          echo "::error::Build produced warnings"
          exit 1
        fi

    - name: Test with coverage
      run: snforge test --coverage

    - name: Upload coverage
      uses: actions/upload-artifact@v4
      with:
        name: coverage
        path: coverage/coverage.lcov

    - name: Contract size check
      run: scripts/check_sizes.sh
