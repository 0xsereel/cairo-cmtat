[package]
name = "cairo_cmtat"
version = "0.1.0"
edition = "2024_07"
description = "Comprehensive CMTAT implementation in Cairo for Starknet"
license = "MPL-2.0"
cairo-version = "2.18.0"

[dependencies]
openzeppelin = { git = "https://github.com/OpenZeppelin/cairo-contracts.git", tag = "v4.0.1" }
starknet = "2.18.0"

[dev-dependencies]
snforge_std = "0.59.0"
assert_macros = "2.18.0"

[[target.starknet-contract]]
sierra = true
casm = true

[tool.snforge]
exit_first = true

[tool.scarb]
allow-prebuilt-plugins = ["snforge_std"]

# Required by `snforge test --coverage`. Size checks use the release profile.
[profile.dev.cairo]
unstable-add-statements-functions-debug-info = true
unstable-add-statements-code-locations-debug-info = true
inlining-strategy = "avoid"
